name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # ubuntu-24.04: the newest runner image no longer offers Python 3.9, and Lite supports 3.9+
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q
